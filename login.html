<!DOCTYPE html>
<html lang="en">
<script src="/includes.js"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In | Sphynx Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; }
  .login-card { background: white; border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 4px 24px rgba(11,31,58,.08); }
  .login-logo { text-align: center; margin-bottom: 2rem; }
  .login-logo img { height: 36px; }
  .login-card h1 { font-family: 'DM Serif Display', serif; font-size: 1.75rem; color: var(--navy); margin-bottom: .4rem; }
  .login-card .subtitle { font-size: .9rem; color: var(--muted); margin-bottom: 2rem; line-height: 1.6; }
  .sent-state { text-align: center; padding: 1rem 0; }
  .sent-state .sent-icon { font-size: 3rem; margin-bottom: 1rem; }
  .sent-state h2 { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--navy); margin-bottom: .75rem; }
  .sent-state p { font-size: .9rem; color: var(--muted); line-height: 1.65; }
  .divider { display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0; color: var(--muted); font-size: .82rem; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .privacy-note { font-size: .78rem; color: var(--muted); text-align: center; margin-top: 1.25rem; line-height: 1.5; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/store.html" class="nav-logo"><img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/themes/2147733204/settings_images/3AWlHv0sQ5mNQO1BaIOw_Sphynx_Logo_Final_BlackandBlue_LONG-01.png" alt="Sphynx Automation"></a>
    <ul class="nav-links">
      <li><a href="/store.html">Store</a></li>
    </ul>
  </div>
</nav>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/themes/2147733204/settings_images/3AWlHv0sQ5mNQO1BaIOw_Sphynx_Logo_Final_BlackandBlue_LONG-01.png" alt="Sphynx Automation">
    </div>

    <div id="loginForm">
      <h1>Welcome back</h1>
      <p class="subtitle">Enter your email and we'll send you a magic link — no password needed.</p>
      <div id="alertBanner"></div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="emailInput" placeholder="you@yourfirm.com" autofocus>
      </div>
      <button class="btn btn-primary btn-full" id="sendBtn" onclick="sendMagicLink()">Send Magic Link</button>
      <div class="privacy-note">We'll email you a secure sign-in link. No password required. Your data is never shared.</div>
    </div>

    <div id="sentState" class="sent-state" style="display:none">
      <div class="sent-icon">📬</div>
      <h2>Check your inbox</h2>
      <p>We sent a magic link to <strong id="sentEmail"></strong>. Click it to sign in instantly — it expires in 1 hour.</p>
      <br>
      <button class="btn btn-outline btn-full" onclick="resetForm()">Use a different email</button>
    </div>
  </div>
</div>

<script type="module">
import { supabase, getUser } from '/lib/supabase.js';

// If already logged in, redirect
const user = await getUser();
if (user) {
  const params = new URLSearchParams(window.location.search);
  window.location.href = params.get('redirect') === 'store' ? '/store.html' : '/dashboard.html';
}

// Handle magic link callback (Supabase redirects back here with token)
const { data: { session } } = await supabase.auth.getSession();
if (session) {
  window.location.href = '/dashboard.html';
}

window.sendMagicLink = async function() {
  const email = document.getElementById('emailInput').value.trim();
  if (!email) { showAlert('error', 'Please enter your email address.'); return; }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Sending...';

  const redirectTo = `${window.location.origin}/dashboard.html`;
  const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } });

  if (error) {
    showAlert('error', error.message);
    btn.disabled = false;
    btn.textContent = 'Send Magic Link';
  } else {
    document.getElementById('sentEmail').textContent = email;
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('sentState').style.display = 'block';
  }
};

window.resetForm = function() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('sentState').style.display = 'none';
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('sendBtn').textContent = 'Send Magic Link';
};

function showAlert(type, msg) {
  document.getElementById('alertBanner').innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}
</script>
</body>
</html>
