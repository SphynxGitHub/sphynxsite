<style>
  .filter-bar { background: white; border-bottom: 1px solid var(--border); padding: 1rem 2rem; position: sticky; top: 64px; z-index: 50; }
  .filter-inner { max-width: 1200px; margin: 0 auto; display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
  .filter-btn { background: var(--bg); border: 1.5px solid var(--border); color: var(--muted); font-family: 'Outfit', sans-serif; font-size: .83rem; font-weight: 600; padding: .4rem 1rem; border-radius: 100px; cursor: pointer; transition: all .2s; }
  .filter-btn.active { background: var(--navy); border-color: var(--navy); color: white; }
  .filter-btn:hover:not(.active) { border-color: var(--blue); color: var(--blue); }

  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
  .product-card { background: white; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform .3s, box-shadow .3s; }
  .product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 36px rgba(11,31,58,.1); }
  .product-card.hidden { display: none; }
  .product-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--bg); }
  .product-img-placeholder { width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, var(--blue-light), var(--accent-light)); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
  .product-body { padding: 1.4rem; flex: 1; display: flex; flex-direction: column; }
  .product-cat { margin-bottom: .6rem; }
  .product-body h3 { font-size: 1rem; font-weight: 700; color: var(--navy); line-height: 1.4; margin-bottom: .6rem; }
  .product-desc { font-size: .85rem; color: var(--muted); line-height: 1.6; flex: 1; margin-bottom: 1.25rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .product-footer { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-top: auto; }
  .product-price { font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--navy); }
  .purchased-badge { display: flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 700; color: var(--green); }
  .section-label { font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 2.5rem 0 1rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); }
  .search-wrap { margin-left: auto; }
  .search-wrap input { padding: .4rem .9rem; border: 1.5px solid var(--border); border-radius: 100px; font-family: 'Outfit', sans-serif; font-size: .83rem; outline: none; transition: border-color .2s; width: 200px; }
  .search-wrap input:focus { border-color: var(--blue); }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="nav-logo"><img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/themes/2147733204/settings_images/3AWlHv0sQ5mNQO1BaIOw_Sphynx_Logo_Final_BlackandBlue_LONG-01.png" alt="Sphynx Automation"></a>

    </div>

<div class="container">

  <div id="productsGrid" class="products-grid">
    <div class="empty-state" style="grid-column:1/-1">

<input type="hidden" id="discountCodeInput">
<script>
// ── GLOBALS — must be in regular script for onclick to work ──
const storeFilters = { cat: 'all', type: 'all', impl: 'all', stage: 'all', app: 'all' };

window.setStoreFilter = function(group, val, btn) {
  storeFilters[group] = val;
  btn.closest('div').querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  window.runStoreFilter();
};

window.runStoreFilter = function() {
  const q = (document.getElementById('storeSearch')?.value || '').toLowerCase();
  const cards = document.querySelectorAll('.product-card');
  let visible = 0;
  cards.forEach(function(card) {
    const search = (card.dataset.search || '').toLowerCase();
    const matchQ = !q || search.includes(q);
    const matchCat = storeFilters.cat === 'all' || card.dataset.cat === storeFilters.cat;
    const matchType = storeFilters.type === 'all' || card.dataset.type === storeFilters.type;
    const matchImpl = storeFilters.impl === 'all' || card.dataset.impl === storeFilters.impl;
    const matchStage = storeFilters.stage === 'all' || (card.dataset.stages||'').toLowerCase().includes(storeFilters.stage.toLowerCase());
    const matchApp = storeFilters.app === 'all' || (card.dataset.apps||'').toLowerCase().includes(storeFilters.app.toLowerCase());
    const show = matchQ && matchCat && matchType && matchImpl && matchStage && matchApp;
    card.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('emptyState')?.remove();
  if (!visible) {
    const el = document.createElement('div');
    el.id = 'emptyState';
    el.style.cssText = 'text-align:center;padding:4rem;color:var(--muted);grid-column:1/-1';
    el.innerHTML = '<p>No products match your filters. <button onclick="resetFilters()" style="background:none;border:none;color:var(--blue);font-weight:600;cursor:pointer;font-family:inherit">Clear filters</button></p>';
    document.getElementById('productsGrid').appendChild(el);
  }
};

window.resetFilters = function() {
  Object.keys(storeFilters).forEach(function(k) { storeFilters[k] = 'all'; });
  document.querySelectorAll('.filter-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.val === 'all');
  });
  var s = document.getElementById('storeSearch');
  if (s) s.value = '';
  window.runStoreFilter();
};

async function checkout(stripePriceId, productId) {
  if (!currentUser) { window.location.href = '/login.html'; return; }
  const btn = document.querySelector(`[data-pid="${productId}"]`);
  if (btn) { btn.disabled = true; btn.textContent = 'Loading...'; }
  try {
    const code = document.getElementById('discountCodeInput')?.value?.trim() || '';
    const res = await fetch('/api/create-checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ priceId: stripePriceId, productId, userId: currentUser?.id, discountCode: code })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    window.location.href = data.url;
  } catch(e) {
    alert('Checkout error: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = 'Buy Now'; }
  }
}

window.checkout = checkout;

window.signOut = async function() {
  await supabase.auth.signOut();
  window.location.href = '/login.html';
};
</script>
<script type="module">
import { supabase, getUser, getUserPurchases } from '/lib/supabase.js';

const STRIPE_KEY = '__NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY__';
let stripe;
let currentUser = null;
let userPurchases = [];
let allProducts = [];

async function init() {
  stripe = Stripe(STRIPE_KEY);
  currentUser = await getUser();

  if (currentUser) {
    document.getElementById('navUser').innerHTML = `
      <span>${currentUser.email}</span>
      <a href="/dashboard.html" class="btn-sm btn-ghost-sm">My Courses</a>
      <button class="btn-sm btn-ghost-sm" onclick="signOut()">Sign Out</button>`;
    userPurchases = (await getUserPurchases(currentUser.id)).map(p => p.product_id);
  }

  await loadProducts();

  


  // search handled by storeSearch input oninput
}

async function loadCategories() {
  // Load categories for cat filter
  const { data: catData } = await supabase.from('categories').select('*').order('sort_order').order('name');
  const filterCat = document.getElementById('filterCat');
  if (filterCat) {
    const cats = catData?.length
      ? catData.map(c => c.name)
      : [...new Set(allProducts.map(p => p.category).filter(Boolean))].sort();
    filterCat.innerHTML = '<button class="filter-btn active" data-val="all" data-group="cat" onclick="setStoreFilter(this.dataset.group,this.dataset.val,this)">All</button>' +
      cats.map(c => `<button class="filter-btn" data-val="${c}" data-group="cat" onclick="setStoreFilter(this.dataset.group,this.dataset.val,this)">${c}</button>`).join('');
  }
  // Load apps for app filter
  const { data: appsData } = await supabase.from('apps').select('name').order('sort_order').order('name');
  const filterApps = document.getElementById('filterApps');
  if (filterApps && appsData?.length) {
    filterApps.innerHTML = '<button class="filter-btn active" data-val="all" data-group="app" onclick="setStoreFilter(this.dataset.group,this.dataset.val,this)">All</button>' +
      appsData.map(a => `<button class="filter-btn" data-val="${a.name}" data-group="app" onclick="setStoreFilter(this.dataset.group,this.dataset.val,this)">${a.name}</button>`).join('');
  }
}

async function loadProducts() {
  const { data, error } = await supabase
    .from('products')
    .select('*')
    .eq('active', true)
    .order('category')
    .order('sort_order');

  if (error) {
    document.getElementById('productsGrid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon"><i data-lucide="alert-circle" style="width:48px;height:48px;opacity:.4"></i></div>
        <h3>Could not load products</h3>
        <p style="font-size:.8rem;font-family:monospace;color:var(--muted)">${error.message}</p>
        <p>Check that your Supabase env vars are set and the products table exists.</p>
      </div>`;
    console.error('Supabase error:', error);
    return;
  }
  if (!data?.length) {
    document.getElementById('productsGrid').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon"><i data-lucide="package" style="width:48px;height:48px;opacity:.4"></i></div>
        <h3>No products yet</h3>
        <p>Run the product batch SQL insert, or add products in the Store Manager.</p>
        <a href="/store-manager.html" class="btn btn-primary" style="margin-top:1rem">Go to Store Manager</a>
      </div>`;
    return;
  }

  allProducts = data;
  renderProducts(data);
  await loadCategories();
}

function renderProducts(products) {
  // group by category
  const grouped = {};
  products.forEach(p => {
    if (!grouped[p.category]) grouped[p.category] = [];
    grouped[p.category].push(p);
  });

  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';

  if (!products.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon"><i data-lucide="search" style="width:48px;height:48px;opacity:.4"></i></div><h3>No results</h3><p>Try a different search or filter.</p></div>`;
    return;
  }

  Object.entries(grouped).forEach(([cat, items]) => {
    const label = document.createElement('div');
    label.className = 'section-label';
    label.style.gridColumn = '1 / -1';
    label.textContent = cat;
    grid.appendChild(label);

    items.forEach(p => {
      const owned = userPurchases.includes(p.id);
      // Build product page URL
      const productUrl = `/product.html?id=${p.id}`;

      const card = document.createElement('div');
      card.className = 'product-card';
      card.dataset.search = [p.name, p.category, p.description, ...(p.apps||[])].filter(Boolean).join(' ').toLowerCase();
      card.dataset.cat = p.category || '';
      card.dataset.type = p.product_type || '';
      card.dataset.impl = p.implementation_type || '';
      card.dataset.stages = (p.lifecycle_stages || []).join(',').toLowerCase();
      card.dataset.apps = (p.apps || []).join(',').toLowerCase();
      card.dataset.cat = p.category;
      card.dataset.name = p.name.toLowerCase();
      card.innerHTML = `
        ${p.image_url
          ? `<img class="product-img" src="${p.image_url}" alt="${p.name}" loading="lazy">`
          : `<div class="product-img-placeholder">${categoryEmoji(p.category)}</div>`}
        <div class="product-body">
          <div class="product-cat"><span class="badge ${categoryBadge(p.category)}">${p.category}</span></div>
          <h3>${p.name}</h3>
          <p class="product-desc">${p.description}</p>
          <div class="product-footer">
            <div class="product-price">$${(p.price / 100).toFixed(2)}</div>
            ${owned
              ? `<div class="purchased-badge">✓ Purchased <a href="/course.html?id=${p.id}" class="btn btn-outline" style="padding:.4rem .9rem;font-size:.82rem;margin-left:.5rem">Open →</a></div>`
              : `<div style="display:flex;flex-direction:column;gap:.4rem;width:100%">
                  <a href="/product.html?id=${p.id}" class="btn btn-outline" style="text-align:center;width:100%;box-sizing:border-box">View Details</a>
                  ${p.stripe_price_id
                    ? `<button class="btn btn-primary" style="width:100%" data-price="${p.stripe_price_id}" data-pid="${p.id}" onclick="checkout(this.dataset.price,this.dataset.pid)">Buy Now — $${(p.price/100).toFixed(2)}</button>`
                    : p.kajabi_url
                      ? `<a href="${p.kajabi_url}" class="btn btn-primary" target="_blank" style="text-align:center;width:100%;box-sizing:border-box">Buy Now — $${(p.price/100).toFixed(2)}</a>`
                      : `<a href="/contact.html" class="btn btn-primary" style="text-align:center;width:100%;box-sizing:border-box">Get Started</a>`}
                </div>`}
          </div>
        </div>`;
      grid.appendChild(card);
    });
  });
}

// Check for successful payment return
const params = new URLSearchParams(window.location.search);
if (params.get('success')) showAlert('success', 'Purchase successful! Check your email and visit My Courses to access your content.');
if (params.get('cancelled')) showAlert('info', 'Checkout was cancelled — no charge was made.');

init();
</script>
<script src="https://js.stripe.com/v3/"></script>
</body>
