<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Courses | Sphynx Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<style>
  .dashboard-grid { display: grid; grid-template-columns: 260px 1fr; gap: 2.5rem; max-width: 1200px; margin: 0 auto; padding: 3rem 2rem; }
  .sidebar { position: sticky; top: 90px; height: fit-content; }
  .user-card { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; margin-bottom: 1.25rem; text-align: center; }
  .user-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--blue-light); color: var(--blue); font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
  .user-email { font-size: .85rem; color: var(--muted); word-break: break-all; margin-bottom: 1rem; }
  .sidebar-nav { background: white; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .sidebar-nav a { display: flex; align-items: center; gap: .75rem; padding: .9rem 1.25rem; font-size: .88rem; font-weight: 500; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--bg); transition: background .2s, color .2s; }
  .sidebar-nav a:last-child { border-bottom: none; }
  .sidebar-nav a:hover, .sidebar-nav a.active { background: var(--bg); color: var(--navy); }
  .sidebar-nav a .nav-icon { font-size: 1rem; }

  .purchases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
  .purchases-list { display: flex; flex-direction: column; gap: .75rem; }
  .purchases-list .purchase-card { display: grid; grid-template-columns: 80px 1fr auto; align-items: center; gap: 1.25rem; padding: 1rem 1.25rem; }
  .purchases-list .purchase-img { width: 80px; height: 56px; border-radius: 8px; object-fit: cover; }
  .purchases-list .purchase-img-placeholder { width: 80px; height: 56px; border-radius: 8px; }
  .purchases-list .purchase-footer { flex-direction: column; align-items: flex-end; gap: .4rem; }
  .purchases-toolbar { display: flex; gap: .75rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .purchases-search { flex: 1; min-width: 200px; padding: .6rem 1rem; border: 1.5px solid var(--border); border-radius: 100px; font-family: 'Outfit', sans-serif; font-size: .88rem; outline: none; transition: border-color .2s; }
  .purchases-search:focus { border-color: var(--blue); }
  .cat-filter { background: var(--bg); border: 1.5px solid var(--border); color: var(--muted); font-family: 'Outfit', sans-serif; font-size: .78rem; font-weight: 600; padding: .35rem .85rem; border-radius: 100px; cursor: pointer; transition: all .2s; white-space: nowrap; }
  .cat-filter.active { background: var(--navy); border-color: var(--navy); color: white; }
  .cat-filter:hover:not(.active) { border-color: var(--blue); color: var(--blue); }
  .view-toggle { display: flex; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; }
  .view-btn { background: white; border: none; padding: .45rem .75rem; cursor: pointer; color: var(--muted); transition: all .2s; display: flex; align-items: center; gap: .35rem; font-family: 'Outfit', sans-serif; font-size: .78rem; font-weight: 600; }
  .view-btn.active { background: var(--navy); color: white; }
  .view-btn i { width: 16px; height: 16px; }
  .purchase-card { background: white; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: transform .25s, box-shadow .25s; display: flex; flex-direction: column; }
  .purchase-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(11,31,58,.09); }
  .purchase-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--bg); }
  .purchase-img-placeholder { width: 100%; aspect-ratio: 16/9; background: linear-gradient(135deg, var(--blue-light), var(--accent-light)); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
  .purchase-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
  .purchase-body h3 { font-size: .95rem; font-weight: 700; color: var(--navy); line-height: 1.4; margin-bottom: .75rem; }
  .purchase-meta { font-size: .78rem; color: var(--muted); margin-bottom: .75rem; }
  .progress-label { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; }
  .open-btn { margin-top: auto; padding-top: 1rem; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
  .stat-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; text-align: center; }
  .stat-card .stat-val { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--navy); line-height: 1; }
  .stat-card .stat-label { font-size: .78rem; color: var(--muted); margin-top: .3rem; }

  @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } .sidebar { position: static; } }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/store.html" class="nav-logo"><img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/themes/2147733204/settings_images/3AWlHv0sQ5mNQO1BaIOw_Sphynx_Logo_Final_BlackandBlue_LONG-01.png" alt="Sphynx Automation"></a>
    <ul class="nav-links">
      <li><a href="/store.html">Store</a></li>
      <li><a href="/dashboard.html" class="active">My Courses</a></li>
    </ul>
    <div class="nav-user" id="navUser"></div>
  </div>
</nav>

<div class="dashboard-grid">
  <aside class="sidebar">
    <div class="user-card">
      <div class="user-avatar" id="userAvatar">?</div>
      <div class="user-email" id="userEmail">Loading...</div>
      <button class="btn btn-outline btn-full btn-sm" onclick="signOut()">Sign Out</button>
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard.html" class="active"><i data-lucide="book-open" style="width:14px;height:14px"></i> My Courses</a>
      <a href="/store.html"><i data-lucide="shopping-bag" style="width:14px;height:14px"></i> Browse Store</a>
      <a href="/index.html"><i data-lucide="home" style="width:14px;height:14px"></i> Main Site</a>
    </nav>
  </aside>

  <main>
    <div class="stats-row" id="statsRow">
      <div class="stat-card"><div class="stat-val" id="statPurchased">—</div><div class="stat-label">Purchased</div></div>
      <div class="stat-card"><div class="stat-val" id="statCompleted">—</div><div class="stat-label">Completed</div></div>
      <div class="stat-card"><div class="stat-val" id="statInProgress">—</div><div class="stat-label">In Progress</div></div>
    </div>

    <h2 style="font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--navy);margin-bottom:1.25rem;">My Purchases</h2>
    <!-- TOOLBAR -->
    <div class="purchases-toolbar" id="purchasesToolbar" style="display:none">
      <div style="display:flex;gap:.75rem;align-items:center;width:100%">
        <input type="text" class="purchases-search" id="purchaseSearch" placeholder="Search your courses..." oninput="filterPurchases()">
        <div class="view-toggle">
        <button class="view-btn active" id="viewGrid" onclick="setView('grid')" title="Grid view">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Grid
        </button>
        <button class="view-btn" id="viewList" onclick="setView('list')" title="List view">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          List
        </button>
        </div>
      </div>
      <div id="catFilters" style="display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem"></div>
    </div>

    <div id="purchasesGrid" class="purchases-grid">
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon"><i data-lucide="loader" style="width:48px;height:48px;opacity:.4"></i></div><h3>Loading your courses...</h3>
      </div>
    </div>
  </main>
</div>

<script>
// Filter and view functions — defined in regular script so oninput can access them
window.filterPurchases = function() {
  const q = (document.getElementById('purchaseSearch')?.value || '').toLowerCase();
  const activeCat = document.querySelector('.cat-filter.active')?.dataset.cat || 'all';
  const grid = document.getElementById('purchasesGrid');
  if (!grid) return;
  const cards = grid.querySelectorAll('.purchase-card');
  let visible = 0;
  cards.forEach(function(card) {
    const searchable = card.dataset.search || card.dataset.name || '';
    const cat = card.dataset.cat || '';
    const matchQ = !q || searchable.includes(q);
    const matchCat = activeCat === 'all' || cat === activeCat;
    card.style.display = matchQ && matchCat ? '' : 'none';
    if (matchQ && matchCat) visible++;
  });
  document.getElementById('noResults')?.remove();
  if (!visible && (q || activeCat !== 'all')) {
    const el = document.createElement('div');
    el.id = 'noResults';
    el.style.cssText = 'text-align:center;padding:2rem;color:var(--muted);grid-column:1/-1';
    el.innerHTML = '<p>No courses match your search.</p>';
    grid.appendChild(el);
  }
};

window.setCatFilter = function(btn) {
  document.querySelectorAll('.cat-filter').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  window.filterPurchases();
};

window.setView = function(view) {
  const grid = document.getElementById('purchasesGrid');
  if (!grid) return;
  grid.className = view === 'grid' ? 'purchases-grid' : 'purchases-list';
  document.getElementById('viewGrid').classList.toggle('active', view === 'grid');
  document.getElementById('viewList').classList.toggle('active', view === 'list');
  window.filterPurchases();
};
</script>
<script type="module">
import { supabase, getUser } from '/lib/supabase.js';

async function initDashboard() {
const user = await getUser();
if (!user) { window.location.href = '/login.html'; return; }

document.getElementById('userEmail').textContent = user.email;
document.getElementById('userAvatar').textContent = user.email[0].toUpperCase();
document.getElementById('navUser').innerHTML = `<button class="btn-sm btn-ghost-sm" onclick="signOut()">Sign Out</button>`;

// Load purchases + product details + progress
const { data: purchases, error: purchaseErr } = await supabase
  .from('purchases')
  .select('product_id, purchased_at, products(*)')
  .eq('user_id', user.id);

console.log('User ID:', user.id);
console.log('Purchases:', purchases, 'Error:', purchaseErr);

if (purchaseErr) {
  document.getElementById('purchasesGrid').innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted)">
      <p style="font-family:monospace;font-size:.8rem;color:red">${purchaseErr.message}</p>
      <p>There was an error loading your purchases. Please try refreshing.</p>
    </div>`;
  return;
}

const { data: allProgress } = await supabase
  .from('progress')
  .select('product_id, lesson_id, completed')
  .eq('user_id', user.id);

allPurchases = purchases || [];
const grid = document.getElementById('purchasesGrid');

// Show toolbar if there are purchases
if (purchases?.length) {
  document.getElementById('purchasesToolbar').style.display = 'flex';
  buildCatFilters(purchases);
}

if (!purchases?.length) {
  grid.innerHTML = `
    <div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon"><i data-lucide="shopping-bag" style="width:48px;height:48px;opacity:.4"></i></div>
      <h3>No purchases yet</h3>
      <p>Head to the store to find templates and courses for your practice.</p>
      <a href="/store.html" class="btn btn-primary">Browse Store</a>
    </div>`;
  document.getElementById('statPurchased').textContent = '0';
  document.getElementById('statCompleted').textContent = '0';
  document.getElementById('statInProgress').textContent = '0';
  return;
}

let completedCount = 0, inProgressCount = 0;

grid.innerHTML = '';
purchases.forEach(({ product_id, purchased_at, products: p }) => {
  if (!p) return;
  const productProgress = allProgress?.filter(pr => pr.product_id === product_id) || [];
  const completedLessons = productProgress.filter(pr => pr.completed).length;
  const totalLessons = p.lesson_count || 0;
  const pct = totalLessons > 0 ? Math.round((completedLessons / totalLessons) * 100) : null;

  if (pct === 100) completedCount++;
  else if (pct !== null && pct > 0) inProgressCount++;

  const purchaseDate = new Date(purchased_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const card = document.createElement('div');
  card.className = 'purchase-card';
  card.innerHTML = `
    ${p.image_url
      ? `<img class="purchase-img" src="${p.image_url}" alt="${p.name}" loading="lazy">`
      : `<div class="purchase-img-placeholder">${categoryEmoji(p.category)}</div>`}
    <div class="purchase-body">
      <span class="badge badge-teal" style="margin-bottom:.6rem">${p.category}</span>
      <h3>${p.name}</h3>
      <div class="purchase-meta">Purchased ${purchaseDate}</div>
      ${pct !== null ? `
        <div class="progress-label"><span>Progress</span><span>${pct}%</span></div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      ` : ''}
      <div class="open-btn">
        <a href="/course.html?id=${product_id}" class="btn btn-primary btn-full">
          ${pct === 100 ? '✓ Review Course' : pct > 0 ? 'Continue →' : 'Start Course →'}
        </a>
      </div>
    </div>`;
  grid.appendChild(card);
});

document.getElementById('statPurchased').textContent = purchases.length;
document.getElementById('statCompleted').textContent = completedCount;
document.getElementById('statInProgress').textContent = inProgressCount;

function categoryIcon(cat) {
  const map = { 'Integration': 'link', 'JotForm': 'clipboard', 'Training': 'graduation-cap', 'Email Campaign': 'mail', 'Zapier': 'zap' };
  return map[cat] || 'package';
}
function categoryEmoji(cat) {
  const icon = categoryIcon(cat);
  return `<i data-lucide="${icon}" style="width:28px;height:28px;color:var(--muted)"></i>`;
}

} // end initDashboard
initDashboard();

// filter functions defined in regular script above

window.signOut = async function() {
  await supabase.auth.signOut();
  window.location.href = '/login.html';
};
</script>
</body>
</html>
