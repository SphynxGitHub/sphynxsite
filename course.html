<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course | Sphynx Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<style>
  .course-layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 64px); }
  .course-sidebar { background: white; border-right: 1px solid var(--border); padding: 1.5rem; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
  .course-sidebar h2 { font-size: .9rem; font-weight: 700; color: var(--navy); margin-bottom: 1.25rem; line-height: 1.4; }
  .overall-progress { margin-bottom: 1.5rem; }
  .overall-progress .progress-label { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; }
  .lesson-list { list-style: none; display: flex; flex-direction: column; gap: .3rem; }
  .lesson-item { display: flex; align-items: center; gap: .75rem; padding: .65rem .85rem; border-radius: 9px; cursor: pointer; transition: background .2s; border: 1.5px solid transparent; }
  .lesson-item:hover { background: var(--bg); }
  .lesson-item.active { background: var(--blue-light); border-color: #bfdbfe; }
  .lesson-item.completed .lesson-check { background: var(--accent); color: white; }
  .lesson-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: .7rem; flex-shrink: 0; transition: background .2s, border-color .2s; }
  .lesson-item.completed .lesson-check { border-color: var(--accent); }
  .lesson-title { font-size: .85rem; color: var(--text); line-height: 1.35; }
  .lesson-item.active .lesson-title { font-weight: 700; color: var(--navy); }
  .section-header { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: .75rem .85rem .3rem; }

  .course-main { padding: 2.5rem; background: var(--bg); }
  .lesson-header { margin-bottom: 2rem; }
  .lesson-header h1 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--navy); margin-bottom: .5rem; }
  .lesson-header p { font-size: .9rem; color: var(--muted); }
  .video-wrap { background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9; margin-bottom: 2rem; }
  .video-wrap iframe { width: 100%; height: 100%; border: none; }
  .lesson-content { background: white; border: 1px solid var(--border); border-radius: 14px; padding: 2rem; margin-bottom: 1.5rem; }
  .lesson-content h2 { font-size: 1.1rem; font-weight: 700; color: var(--navy); margin: 1.5rem 0 .6rem; }
  .lesson-content h2:first-child { margin-top: 0; }
  .lesson-content p { font-size: .93rem; color: var(--muted); line-height: 1.75; margin-bottom: 1rem; }
  .lesson-content ul, .lesson-content ol { margin: .75rem 0 1rem 1.5rem; }
  .lesson-content li { font-size: .93rem; color: var(--muted); line-height: 1.65; margin-bottom: .4rem; }
  .lesson-nav { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .note-btn { background: white; border: 1.5px solid var(--border); color: var(--muted); font-family: 'Outfit',sans-serif; font-size: .82rem; font-weight: 600; padding: .5rem 1rem; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: .4rem; transition: all .2s; }
  .note-btn:hover { border-color: var(--blue); color: var(--blue); }
  .note-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 500; align-items: center; justify-content: center; padding: 1.5rem; }
  .note-modal.open { display: flex; }
  .note-box { background: white; border-radius: 18px; padding: 2rem; max-width: 500px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .note-box h3 { font-family: 'DM Serif Display',serif; font-size: 1.3rem; color: var(--navy); margin-bottom: .4rem; }
  .note-box p { font-size: .85rem; color: var(--muted); margin-bottom: 1.25rem; }
  .preset-btns { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  .preset-btn { background: var(--bg); border: 1.5px solid var(--border); color: var(--text); font-family: 'Outfit',sans-serif; font-size: .8rem; font-weight: 500; padding: .4rem .85rem; border-radius: 100px; cursor: pointer; transition: all .2s; }
  .preset-btn:hover, .preset-btn.selected { background: var(--blue-light); border-color: var(--blue); color: var(--blue); }
  .note-textarea { width: 100%; min-height: 100px; padding: .75rem 1rem; border: 1.5px solid var(--border); border-radius: 10px; font-family: 'Outfit',sans-serif; font-size: .88rem; resize: vertical; outline: none; box-sizing: border-box; margin-bottom: 1rem; }
  .note-textarea:focus { border-color: var(--blue); }
  .note-footer { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  .note-status { font-size: .82rem; color: var(--muted); }
  .complete-btn { display: flex; align-items: center; gap: .6rem; padding: .75rem 1.5rem; border-radius: 10px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: .92rem; cursor: pointer; border: 2px solid var(--accent); background: transparent; color: var(--accent); transition: all .2s; }
  .complete-btn.done { background: var(--accent); color: var(--navy); }
  .complete-btn:hover { background: var(--accent); color: var(--navy); }
  .download-section { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .download-section h4 { font-size: .9rem; font-weight: 700; color: var(--navy); margin-bottom: .2rem; }
  .download-section p { font-size: .8rem; color: var(--muted); }

  @media (max-width: 900px) { .course-layout { grid-template-columns: 1fr; } .course-sidebar { position: static; height: auto; } }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/store.html" class="nav-logo"><img src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/themes/2147733204/settings_images/3AWlHv0sQ5mNQO1BaIOw_Sphynx_Logo_Final_BlackandBlue_LONG-01.png" alt="Sphynx Automation"></a>
    <ul class="nav-links">
      <li><a href="/dashboard.html">← My Courses</a></li>
    </ul>
    <div class="nav-user" id="navUser"></div>
  </div>
</nav>

<div class="course-layout">
  <aside class="course-sidebar" id="courseSidebar">
    <div style="color:var(--muted);font-size:.88rem">Loading...</div>
  </aside>
  <main class="course-main" id="courseMain">
    <div class="empty-state"><div class="empty-icon"><i data-lucide="loader" style="width:48px;height:48px;opacity:.4"></i></div><h3>Loading course...</h3></div>
  </main>
</div>

<script type="module">
import { supabase, getUser, getProgress, toggleLesson } from '/lib/supabase.js';

const params = new URLSearchParams(window.location.search);
const productId = params.get('id');
if (!productId) window.location.href = '/dashboard.html';

const user = await getUser();
if (!user) window.location.href = '/login.html?redirect=course&id=' + productId;

document.getElementById('navUser').innerHTML = `<span style="font-size:.82rem;color:rgba(255,255,255,.6)">${user.email}</span>`;

// Verify purchase
const { data: purchase } = await supabase
  .from('purchases')
  .select('product_id')
  .eq('user_id', user.id)
  .eq('product_id', productId)
  .single();

if (!purchase) { window.location.href = '/store.html?noaccess=1'; }

// Load product + lessons
const { data: product } = await supabase
  .from('products')
  .select('*, lessons(*)')
  .eq('id', productId)
  .single();

if (!product) { window.location.href = '/dashboard.html'; }

// Sort lessons by sort_order
const lessons = (product.lessons || []).sort((a, b) => a.sort_order - b.sort_order);

// Load progress
let progress = await getProgress(user.id, productId);
let completedIds = new Set(progress.filter(p => p.completed).map(p => p.lesson_id));
let currentLessonIdx = 0;

function pct() {
  return lessons.length ? Math.round((completedIds.size / lessons.length) * 100) : 0;
}

function renderSidebar() {
  const p = pct();
  let html = `
    <h2>${product.name}</h2>
    <div class="overall-progress">
      <div class="progress-label"><span>Overall progress</span><span>${p}%</span></div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="overallBar" style="width:${p}%"></div></div>
    </div>
    <ul class="lesson-list">`;

  let lastSection = null;
  lessons.forEach((lesson, i) => {
    if (lesson.section && lesson.section !== lastSection) {
      html += `<li class="section-header">${lesson.section}</li>`;
      lastSection = lesson.section;
    }
    const done = completedIds.has(lesson.id);
    html += `
      <li class="lesson-item ${done ? 'completed' : ''} ${i === currentLessonIdx ? 'active' : ''}"
          onclick="goToLesson(${i})" id="lesson-item-${i}">
        <div class="lesson-check">${done ? '✓' : ''}</div>
        <div class="lesson-title">${lesson.title}</div>
      </li>`;
  });
  html += `</ul>`;
  document.getElementById('courseSidebar').innerHTML = html;
}

function renderLesson(idx) {
  const lesson = lessons[idx];
  if (!lesson) return;
  currentLessonIdx = idx;
  const done = completedIds.has(lesson.id);

  let html = `
    <div class="lesson-header">
      <h1>${lesson.title}</h1>
      ${lesson.subtitle ? `<p>${lesson.subtitle}</p>` : ''}
    </div>`;

  if (lesson.video_url) {
    let embedUrl = lesson.video_url;
    // YouTube
    if (embedUrl.includes('youtube.com/watch')) {
      embedUrl = embedUrl.replace('watch?v=', 'embed/');
    } else if (embedUrl.includes('youtu.be/')) {
      const id = embedUrl.split('youtu.be/')[1].split('?')[0];
      embedUrl = `https://www.youtube.com/embed/${id}`;
    }
    // Vimeo
    else if (embedUrl.includes('vimeo.com/') && !embedUrl.includes('player.vimeo.com')) {
      const id = embedUrl.split('vimeo.com/')[1].split('?')[0];
      embedUrl = `https://player.vimeo.com/video/${id}`;
    }
    // Wistia — convert medias URL to iframe embed
    else if (embedUrl.includes('wistia.com/medias/') || embedUrl.includes('fast.wistia.com/embed/medias/')) {
      const wId = embedUrl.match(/medias\/([a-z0-9]+)/)?.[1];
      if (wId) embedUrl = `https://fast.wistia.com/embed/iframe/${wId}?autoPlay=false&controlsVisibleOnLoad=true&playerColor=0b1f3a`;
    }
    html += `<div class="video-wrap"><iframe src="${embedUrl}" allowfullscreen allow="autoplay; fullscreen"></iframe></div>`;
  }

  // Also fix content — strip any stray HTML tags that Kajabi might have encoded
  

  // Note to instructor button
  html += `<div style="display:flex;justify-content:flex-end;margin-bottom:1rem">
    <button class="note-btn" onclick="openNoteModal()">
      <i data-lucide="message-circle" style="width:14px;height:14px"></i>
      Send a note to the instructor
    </button>
  </div>`;

  if (lesson.download_url) {
    html += `
      <div class="download-section">
        <div><h4><i data-lucide="paperclip" style="width:15px;height:15px;vertical-align:middle;margin-right:5px"></i>Downloadable Resource</h4><p>${lesson.download_label || 'Download the resource for this lesson'}</p></div>
        <a href="${lesson.download_url}" class="btn btn-blue" target="_blank" download>Download</a>
      </div>`;
  }

  if (lesson.content) {
    // Decode any HTML entities and render properly
    const contentHtml = lesson.content
      .replace(/&lt;/g, '<')
      .replace(/&gt;/g, '>')
      .replace(/&amp;/g, '&')
      .replace(/&quot;/g, '"')
      .replace(/&#39;/g, "'")
      // Wrap plain text paragraphs if no HTML tags present
      .replace(/^([^<].+)$/gm, (line) => line.trim() ? `<p>${line}</p>` : '');
    html += `<div class="lesson-content">${contentHtml}</div>`;
  }

  html += `
    <div class="lesson-nav">
      ${idx > 0 ? `<button class="btn btn-outline" onclick="goToLesson(${idx - 1})">← Previous</button>` : '<div></div>'}
      <button class="complete-btn ${done ? 'done' : ''}" id="completeBtn" onclick="toggleComplete('${lesson.id}', ${idx})">
        ${done ? '✓ Completed' : 'Mark Complete'}
      </button>
      ${idx < lessons.length - 1 ? `<button class="btn btn-primary" onclick="goToLesson(${idx + 1})">Next →</button>` : '<div></div>'}
    </div>`;

  document.getElementById('courseMain').innerHTML = html;
  window.scrollTo(0, 0);
}

window.goToLesson = function(idx) {
  currentLessonIdx = idx;
  renderSidebar();
  renderLesson(idx);
};

window.toggleComplete = async function(lessonId, idx) {
  const nowDone = !completedIds.has(lessonId);
  if (nowDone) completedIds.add(lessonId);
  else completedIds.delete(lessonId);
  await toggleLesson(user.id, productId, lessonId, nowDone);
  renderSidebar();
  renderLesson(idx);
  // Auto-advance to next lesson on mark complete
  if (nowDone && idx < lessons.length - 1) {
    setTimeout(() => goToLesson(idx + 1), 600);
  }
};

// Find first incomplete lesson to start on
const firstIncomplete = lessons.findIndex(l => !completedIds.has(l.id));
currentLessonIdx = firstIncomplete >= 0 ? firstIncomplete : 0;

renderSidebar();
if (lessons.length) {
  renderLesson(currentLessonIdx);
} else {
  document.getElementById('courseMain').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon"><i data-lucide="package" style="width:48px;height:48px;opacity:.4"></i></div>
      <h3>Content coming soon</h3>
      <p>Lessons for this course are being added. Check back shortly!</p>
    </div>`;
}
</script>
<!-- NOTE TO INSTRUCTOR MODAL -->
<div class="note-modal" id="noteModal">
  <div class="note-box">
    <h3>Send a note to the instructor</h3>
    <p>Have feedback or a question about this lesson? We'll get back to you by email.</p>
    <div class="preset-btns" id="presetBtns">
      <button class="preset-btn" onclick="selectPreset(this, 'This content is confusing')">
        <i data-lucide="help-circle" style="width:12px;height:12px;vertical-align:middle;margin-right:3px"></i>
        This is confusing
      </button>
      <button class="preset-btn" onclick="selectPreset(this, 'This content seems out of date')">
        <i data-lucide="clock" style="width:12px;height:12px;vertical-align:middle;margin-right:3px"></i>
        Seems out of date
      </button>
      <button class="preset-btn" onclick="selectPreset(this, 'I have a question about this lesson')">
        <i data-lucide="message-square" style="width:12px;height:12px;vertical-align:middle;margin-right:3px"></i>
        I have a question
      </button>
      <button class="preset-btn" onclick="selectPreset(this, 'The video is not working')">
        <i data-lucide="video-off" style="width:12px;height:12px;vertical-align:middle;margin-right:3px"></i>
        Video not working
      </button>
      <button class="preset-btn" onclick="selectPreset(this, 'I found an error or typo')">
        <i data-lucide="alert-triangle" style="width:12px;height:12px;vertical-align:middle;margin-right:3px"></i>
        Found an error
      </button>
      <button class="preset-btn" onclick="selectPreset(this, 'Great lesson! Just wanted to say thanks')">
        <i data-lucide="thumbs-up" style="width:12px;height:12px;vertical-align:middle;margin-right:3px"></i>
        Love this lesson!
      </button>
    </div>
    <textarea class="note-textarea" id="noteText" placeholder="Add any details here... (optional if you selected a preset above)"></textarea>
    <div class="note-footer">
      <div class="note-status" id="noteStatus"></div>
      <div style="display:flex;gap:.75rem">
        <button class="btn btn-outline" onclick="closeNoteModal()">Cancel</button>
        <button class="btn btn-primary" onclick="sendNote()" id="sendNoteBtn">Send Note</button>
      </div>
    </div>
  </div>
</div>

<script>
window.openNoteModal = function() {
  document.getElementById('noteModal').classList.add('open');
  document.getElementById('noteText').value = '';
  document.getElementById('noteStatus').textContent = '';
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  if (window.lucide) lucide.createIcons();
};

window.closeNoteModal = function() {
  document.getElementById('noteModal').classList.remove('open');
};

window.selectPreset = function(btn, text) {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  const ta = document.getElementById('noteText');
  if (!ta.value || document.querySelector('.preset-btn.selected + [data-preset]')) {
    ta.placeholder = text + ' — add any details below...';
  }
};

window.sendNote = async function() {
  const preset = document.querySelector('.preset-btn.selected')?.textContent?.trim() || '';
  const note = document.getElementById('noteText').value.trim();
  const message = [preset, note].filter(Boolean).join(' — ');
  const st = document.getElementById('noteStatus');
  const btn = document.getElementById('sendNoteBtn');

  if (!message) {
    st.textContent = 'Please select a preset or add a note.';
    st.style.color = 'red';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Sending...';
  st.textContent = '';

  try {
    // Get current lesson info from the page
    const lessonTitle = document.getElementById('lessonTitle')?.textContent || 'Unknown lesson';
    const courseTitle = document.getElementById('courseTitle')?.textContent || 'Unknown course';
    const userEmail = document.getElementById('navUser')?.textContent?.trim() || '';

    // Send via Zapier webhook or direct email
    const ZAPIER_URL = '__ZAPIER_WEBHOOK_URL__';
    if (ZAPIER_URL && !ZAPIER_URL.includes('REPLACE')) {
      await fetch(ZAPIER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'instructor_note',
          from: userEmail,
          course: courseTitle,
          lesson: lessonTitle,
          message,
          sent_at: new Date().toISOString()
        })
      });
    }

    st.textContent = '✓ Note sent! We'll follow up by email.';
    st.style.color = 'var(--accent)';
    btn.textContent = 'Sent!';
    setTimeout(closeNoteModal, 1500);
  } catch(e) {
    st.textContent = 'Could not send — email us at team@sphynxautomation.com';
    st.style.color = 'red';
    btn.disabled = false;
    btn.textContent = 'Send Note';
  }
};

// Close on backdrop click
document.getElementById('noteModal').addEventListener('click', function(e) {
  if (e.target === this) closeNoteModal();
});
</script>

</body>
</html>
